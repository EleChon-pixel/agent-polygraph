name: Publish npm release (trusted publisher)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version in package.json (for example 0.2.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'EleChon-pixel/agent-polygraph'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-agent-polygraph
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Confirm exact version before publishing
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); if(p.name!=="agent-polygraph" || p.version!==process.env.REQUESTED_VERSION) process.exit(2)'
          node -e 'const p=require("./.claude-plugin/plugin.json"); if(p.version!==process.env.REQUESTED_VERSION) process.exit(2)'
          npm --version
      - name: Run full tests
        run: npm test
      - name: Validate package in isolated offline install
        env:
          CHECK_NPM_REGISTRY: '1'
        run: node scripts/release-check.mjs
      - name: Prevent publishing an existing version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if npm view "agent-polygraph@${REQUESTED_VERSION}" version --json >/dev/null 2>&1; then
            echo "::error::This npm version already exists. Versions cannot be overwritten."
            exit 1
          fi
      - name: Publish with GitHub OIDC and npm provenance
        run: npm publish --access public
