name: Stage npm release (trusted publisher)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version in package.json (for example 0.2.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'EleChon-pixel/agent-polygraph'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-agent-polygraph
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          # Don't set registry-url: setup-node v6 creates a dummy _authToken
          # which makes npm fall back to invalid token auth instead of OIDC.
          package-manager-cache: false
      - name: Install pinned npm CLI with staged publishing support
        run: npm install --global npm@11.21.0
      - name: Confirm exact version before staging
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); if(p.name!=="agent-polygraph" || p.version!==process.env.REQUESTED_VERSION) process.exit(2)'
          node -e 'const p=require("./.claude-plugin/plugin.json"); if(p.version!==process.env.REQUESTED_VERSION) process.exit(2)'
          npm --version
      - name: Verify npm accepts this exact trusted publisher (without staging)
        run: node scripts/verify-npm-oidc.mjs
      - name: Run full tests
        run: npm test
      - name: Validate package in isolated offline install
        env:
          CHECK_NPM_REGISTRY: '1'
        run: node scripts/release-check.mjs
      - name: Prevent staging an existing published version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if npm view "agent-polygraph@${REQUESTED_VERSION}" version --json >/dev/null 2>&1; then
            echo "::error::This npm version already exists. Versions cannot be overwritten."
            exit 1
          fi
      - name: Verify OIDC is available and no npm token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC is not available. Check the job's id-token: write permission."
            exit 1
          fi
          # This release deliberately uses OIDC; credentials in npmrc or env
          # can silently override OIDC and trigger E401.
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "::error::A legacy npm token is configured; this release must use OIDC."
            exit 1
          fi
          for npmrc in ".npmrc" "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; do
            if [[ -f "$npmrc" ]] && grep -Eq '_authToken|_auth=' "$npmrc"; then
              echo "::error::An npm token entry is present in npmrc; remove it to allow OIDC."
              exit 1
            fi
          done
          echo "GitHub OIDC available; no legacy npm token configured."
      - name: Stage with GitHub OIDC (maintainer approval and 2FA required)
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm stage publish
