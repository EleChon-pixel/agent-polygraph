name: Independent-reference public holdout audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/eval-holdout.mjs
      - .github/workflows/holdout-evaluation.yml
permissions:
  contents: read
jobs:
  oracle-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Evaluate previously unused external session dataset
        env:
          # Pin after the first successful provenance check.
          HOLDOUT_DATASET: crispwisp/wisp-claude-code-sessions
          HOLDOUT_PREFIX: transcripts/
          HOLDOUT_EXCLUDE_REV: ''
          HOLDOUT_REV: c2c90b59174318ab0b163ec9c9ac82bb879288ce
        run: node scripts/eval-holdout.mjs
