name: One-time merged branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-branch-cleanup.yml]
permissions:
  contents: write
jobs:
  prune-merged-branches:
    if: github.repository == 'EleChon-pixel/agent-polygraph'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only the two branches whose PRs are merged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in fix/privacy-and-verification fix/secure-records-and-benchmarks; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted: ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
          echo "Branches remaining:"
          gh api "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name'
