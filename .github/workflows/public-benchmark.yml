name: public-session benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/benchmark.mjs'
      - 'scripts/eval-public.mjs'
      - '.github/workflows/public-benchmark.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download pinned public transcripts and reproduce original evaluation
        run: node scripts/eval-public.mjs ./eval-data --examples 0
      - name: Compare selective claim guard vs blanket rerun policy
        run: node scripts/benchmark.mjs --claude-dir ./eval-data/claude --codex-dir ./eval-data/codex
      - name: Measure snapshot overhead on generated source files
        run: node scripts/bench-snapshot.mjs
      - name: Discard downloaded transcripts
        if: always()
        run: rm -rf ./eval-data
