name: npm package readiness
on:
  push:
    paths:
      - package.json
      - bin/**
      - src/**
      - scripts/release-check.mjs
      - .github/workflows/npm-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify npm pack and clean offline install
        env:
          CHECK_NPM_REGISTRY: '1'
        run: node scripts/release-check.mjs
